# The screen is the console, the serial port only a second one: Debian's
# cloud image makes ttyS0 the console (the last one named), and on a real PC
# every line systemd writes then waited about 30 seconds on a serial port
# with nothing on it - the stick took over 20 minutes to start on the test
# unit (2026-10-15). A VM still records the kernel's messages from the
# serial port.
GRUB_CMDLINE_LINUX="console=ttyS0,115200 console=tty0 consoleblank=0"
